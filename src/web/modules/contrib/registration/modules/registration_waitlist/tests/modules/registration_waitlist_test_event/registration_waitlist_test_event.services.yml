parameters:
  registration_waitlist_test_event.skip_procedural_hook_scan: true

services:
  registration_waitlist_test_event.event_subscriber:
    class: \Drupal\registration_waitlist_test_event\EventSubscriber\RegistrationEventSubscriber
    tags:
      - { name: event_subscriber }

  # @todo Remove the following when the module only supports Drupal 11.3+,
  # since hook services are then automatically registered.
  # @see https://www.drupal.org/node/3442349
  Drupal\registration_waitlist_test_event\Hook\RegistrationWaitlistTestEventHooks:
    class: Drupal\registration_waitlist_test_event\Hook\RegistrationWaitlistTestEventHooks
    autowire: true
