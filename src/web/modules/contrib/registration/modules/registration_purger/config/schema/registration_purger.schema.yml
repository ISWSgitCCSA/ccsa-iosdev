# Schema for the configuration files of the Registration Purger module.

registration_purger.settings:
  type: config_object
  label: 'Registration purger settings'
  mapping:
    purge_registration_settings_on_delete:
      type: boolean
      label: 'Purge registration settings on host entity delete'
    purge_registration_on_delete:
      type: boolean
      label: 'Purge registrations on host entity delete'
    purge_registration_settings_on_update:
      type: boolean
      label: 'Purge registration settings on host entity update after registration is disabled'
    purge_registration_on_update:
      type: boolean
      label: 'Purge registrations on host entity update after registration is disabled'
