parameters:
  registration_change_host_single_operation.skip_procedural_hook_scan: true

services:
  registration_change_host_single_operation.route_subscriber:
    class: Drupal\registration_change_host_single_operation\Routing\RouteSubscriber
    tags:
      - { name: event_subscriber }
  registration_change_host_single_operation.event_subscriber:
    class: \Drupal\registration_change_host_single_operation\EventSubscriber\RegistrationChangeHostSingleOperationSubscriber
    tags:
      - { name: event_subscriber }

  # @todo Remove the following when the module only supports Drupal 11.3+,
  # since hook services are then automatically registered.
  # @see https://www.drupal.org/node/3442349
  Drupal\registration_change_host_single_operation\Hook\RegistrationChangeHostSingleOperationHooks:
    class: Drupal\registration_change_host_single_operation\Hook\RegistrationChangeHostSingleOperationHooks
    autowire: true
