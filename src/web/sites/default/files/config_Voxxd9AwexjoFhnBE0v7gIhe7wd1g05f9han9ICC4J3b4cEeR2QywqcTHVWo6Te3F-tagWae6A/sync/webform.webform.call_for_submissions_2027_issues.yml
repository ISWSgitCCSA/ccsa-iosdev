css: "div.form-item-submission-start-time label,  div.form-item-submission-editing-deadline label {font-weight:bold;}\r\n#webform-submission-call-for-contributed-podium-and-test-form > div.webform-progress > ul > li:nth-child(5) {display:none;}\r\n\r\n.webform-preview label {font-weight: bold; padding-right: 10px;}\r\n.webform-preview legend {font-weight: bold; }\r\n\r\n.webform-preview summary {font-weight: bold; font-size: 150%; padding-top: 25px; }\r\n"
javascript: "(function ($) {\r\n\r\n  \"use strict\";\r\n  \r\n \r\n  $(document).ajaxComplete(function() {\r\n    \r\n  \r\n  $(function(){\r\n    $('.abstract').on('keyup', function(){\r\n\t\t\r\n\t\t var title =  $(\"input[name=title]\").val();\r\n\t\r\n\t\t var objectives =  $(\"textarea[name=objectives]\").val();\r\n\t\t \r\n\t\t var background =  $(\"textarea[name=background]\").val();\r\n\t\t \r\n\t\t var methods =  $(\"textarea[name=methods]\").val();\r\n\r\n\t\t var results =  $(\"textarea[name=results]\").val();\r\n\t\t\r\n\t\t var conclusions =  $(\"textarea[name=conclusions]\").val();\r\n\r\n\t\t var TotalLength = (title + \" \" + objectives + \" \" + background + \" \" + methods + \" \" + results + \" \" + conclusions).replace(/\\n|\\s{2,}/g, ' ').trim().split(' ').length;\r\n\t\t \r\n\t  $(\"input[name=word_count]\").val(TotalLength);\r\n      \r\n       $(\"input[name=word_count_display]\").val(TotalLength);\r\n      \r\n      \r\n      if (TotalLength >= 301) {\r\n \r\n    //   $(':input.final-submit-button[type=\"submit\"]').prop('disabled', true);\r\n        \r\n        $(':input.webform-button--preview[type=\"submit\"]').prop('disabled', true);\r\n        \r\n        $('.form-item-word-count-warning').show();\r\n        \r\n      } \r\n      \r\n      else {\r\n\r\n        // $(':input.final-submit-button[type=\"submit\"]').prop('disabled', false);\r\n        \r\n        $(':input.webform-button--preview[type=\"submit\"]').prop('disabled', false);\r\n              \r\n        $('.form-item-word-count-warning').hide();\r\n        \r\n      }\r\n      \r\n      \r\n\r\n\t  \r\n\t  \r\n    });\r\n    \r\n    \r\n          var canedit = $(\"input[name=submission_editable_calc]\").val();\r\n  \r\n          if (canedit == \"No\") {\r\n       \r\n            $(':input.final-submit-button[type=\"submit\"]').prop('disabled', true);\r\n            \r\n            $(':input.webform-button--preview[type=\"submit\"]').prop('disabled', true);\r\n            \r\n           }\r\n    \r\n            /* check for conflicts in presentation format */\r\n            \r\n            $(\"input[name='preferred_presentation_format'], input[name='alternate_presentation_format']\").blur(function(){\r\n\r\n            var preferredValue = $(\"input[name='preferred_presentation_format']:checked\").val();\r\n\r\n            var alternateValue = $(\"input[name='alternate_presentation_format']:checked\").val();\r\n            \r\n            if (preferredValue == alternateValue) {\r\n\r\n                alert(\"Your alternate presentation format must be different from your preferred presentation format.\");\r\n              \r\n                $(\"input[name='alternate_presentation_format']\").prop('checked', false);\r\n              \r\n              }\r\n\r\n            });\r\n    \r\n            /* end check for conflicts */\r\n    \r\n});\r\n  \r\n      \r\n   \r\n    \r\n  });\r\n\r\n  \r\n  \r\n  \r\n})(jQuery);\r\n"
