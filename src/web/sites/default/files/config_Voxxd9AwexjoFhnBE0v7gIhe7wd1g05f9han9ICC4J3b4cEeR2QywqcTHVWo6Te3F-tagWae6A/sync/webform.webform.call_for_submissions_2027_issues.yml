  additional_details:
    '#type': webform_wizard_page
    '#title': 'Additional Details'
    '#states_clear': false
    author_names:
      '#type': webform_custom_composite
      '#title': Authors
      '#description': '<strong>Please provide names and affiliations for all authors in the order in which they should appear in the abstract. This list should include the name of the lead presenter.</strong>'
      '#description_display': before
      '#states':
        disabled:
          ':input[name="submission_editable"]':
            value: 'No'
      '#multiple__add_more_button_label': 'Add another author'
      '#multiple__add_more_input_label': 'more authors'
      '#element':
        author_first_name:
          '#type': textfield
          '#required': true
          '#title': 'First Name'
        author_last_name:
          '#type': textfield
          '#required': true
          '#title': 'Last Name'
        author_credentials:
          '#type': textfield
          '#title': Credentials
        author_organization:
          '#type': textfield
          '#required': true
          '#title': Organization/Affiiliation
    program_topics:
      '#type': webform_checkboxes_other
      '#title': 'Program Topics'
      '#description': '<p><strong>Choose all topics that apply. If you do not see an appropriate topic, then please specify under “Other”.</strong></p>'
      '#description_display': before
      '#options':
        'Topic 1': 'Topic 1'
        'Topic 2': 'Topic 2'
        'Topic 3': 'Topic 3'
      '#required': true
      '#states':
        disabled:
          ':input[name="submission_editable"]':
            value: 'No'
    preferred_presentation_format:
      '#type': radios
      '#title': 'Preferred Presentation Format'
      '#description': |
        <p>There is a limited number of openings for podium presentations. If your first choice is a podium presentation but you are willing to present a poster if your abstract is not selected for a podium presentation, then please indicate poster presentation as your alternate presentation format.</p>

        <p><strong>Students who wish to be part of the Outstanding Student Research Competition must select poster presentation as one of their two choices. Please note that only abstracts accepted for poster presentation will be included in the competition.</strong></p>
      '#description_display': before
      '#options':
        Poster: Poster
        Podium: Podium
      '#states':
        disabled:
          ':input[name="submission_editable"]':
            value: 'No'
      '#required': true
    alternate_presentation_format:
      '#type': radios
      '#title': 'Alternate Presentation Format'
      '#options':
        Poster: Poster
        Podium: Podium
        None: 'Not applicable. I do not have a second choice.'
      '#states':
        disabled:
          ':input[name="submission_editable"]':
            value: 'No'
      '#required': true
    consider_for_osra:
      '#type': checkbox
      '#title': 'Consider this presentation for the Outstanding Student Research Award.'
      '#states':
        disabled:
          ':input[name="submission_editable"]':
            value: 'No'
      '#description': 'Only poster presentations are eligible for the OSRA.'
    significance_of_work:
      '#type': textarea
      '#title': 'In 1-2 sentences describe the significance of your work (maximum 100 words).'
      '#required': true
      '#counter_type': word
      '#counter_maximum': 100
      '#states':
        disabled:
          ':input[name="submission_editable"]':
            value: 'No'
        visible:
          ':input[name="consider_for_poster_blitz"]':
