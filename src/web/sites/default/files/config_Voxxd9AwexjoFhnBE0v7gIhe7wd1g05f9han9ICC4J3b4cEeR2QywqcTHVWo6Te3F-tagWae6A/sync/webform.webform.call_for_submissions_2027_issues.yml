id: call_for_submissions_2027_issues
title: 'Call for Submissions - 2027 Issues of Substance Conference'
description: ''
categories: {  }
elements: |-
  agreement:
    '#type': webform_wizard_page
    '#title': Agreement
    '#states_clear': false
    submission_id:
      '#type': webform_computed_twig
      '#title': 'Submission ID'
      '#wrapper_attributes':
        class:
          - hidden
      '#access_update_roles': {  }
      '#template': '{{ uuid |slice(0, 13)}}'
      '#store': true
    submission_start_time:
      '#type': webform_computed_twig
      '#title': 'Submission Start Time'
      '#title_display': inline
      '#template': '{{ created | date("j-M-Y G:i:s T") }}'
    submission_editing_deadline:
      '#type': webform_computed_twig
      '#title': 'Submission Editing Deadline'
      '#template': '{{ created | date_modify("+2 day") | date("j-M-Y G:i:s T") }}'
    submission_editable:
      '#type': webform_computed_twig
      '#title': 'Submission Editable'
      '#display_on': view
      '#template': '{% set deadline = created | date_modify("+2 day") | date("U") %}{% set mydate = date() | date("U") %}{% if (deadline > mydate) %}Yes{% else %}No{% endif %}'
      '#whitespace': trim
      '#store': true
      '#ajax': true
    submission_closed_message:
      '#type': webform_computed_twig
      '#title': 'Submission Closed Message'
      '#title_display': invisible
      '#display_on': form
      '#template': '{% set deadline = created | date_modify("+2 day") | date("U") %}{% set mydate = date() | date("U") %}{% if (deadline > mydate) %}{% else %}<strong>This submission is now closed to further editing. Please note the submission editing deadline above. All current field values are visible, however, resubmission of this form is now disabled.</strong>{% endif %}'
      '#whitespace': spaceless
      '#ajax': true
    introduction:
      '#type': webform_markup
      '#markup': 'To begin your submission, please use the following checklist to indicate that you are ready to continue with the submission process.'
    requirements_understood:
      '#type': checkbox
      '#title': 'I have reviewed and understand the <a href="#" target="_blank">submission requirements</a>.'
      '#required': true
      '#states':
        disabled:
          ':input[name="submission_editable"]':
            value: 'No'
    24_hour_deadline_understood:
      '#type': checkbox
      '#title': 'I am aware that I have 48 hours from the Submission Start Time above during which I can update my submission.'
      '#description': 'We suggest you prepare your abstract in another document, then copy and paste the final information into the online submission application. You will be provided with a submission ID in a confirmation email once the submission is complete.'
      '#description_display': after
      '#required': true
      '#states':
        disabled:
          ':input[name="submission_editable"]':
            value: 'No'
    all_authors_included:
      '#type': checkbox
      '#title': 'I will enter all authors in the order in which they should appear in the program.'
      '#states':
        disabled:
          ':input[name="submission_editable"]':
            value: 'No'
      '#required': true
    title_chosen:
      '#type': checkbox
      '#title': 'I have chosen an appropriate abstract title, and will capitalize only the first word.'
      '#states':
        disabled:
          ':input[name="submission_editable"]':
            value: 'No'
      '#required': true
    abstract_format_prepared:
      '#type': checkbox
      '#title': 'My abstract will be a maximum of 300 words, with the following headings: Objective(s), Background, Methods, Results, Conclusions.'
      '#states':
        disabled:
          ':input[name="submission_editable"]':
            value: 'No'
      '#required': true
    abstract_format_understood:
      '#type': checkbox
      '#title': 'I understand that my submission will be rejected if the abstract does not meet the formatting requirements outlined above.'
      '#states':
        disabled:
          ':input[name="submission_editable"]':
            value: 'No'
      '#required': true
    theme_chosen:
      '#type': checkbox
      '#title': 'I have chosen the theme(s) that most closely align with my submission.'
      '#help_title': Themes
      '#help': 'Theme 1 | Theme 2 | Theme 3'
      '#states':
        disabled:
          ':input[name="submission_editable"]':
            value: 'No'
      '#required': true
    visa_requirement_understood:
      '#type': checkbox
      '#title': 'I understand that I must determine whether I require a visa to attend the conference, and, if so, will submit a request in time for CCSA to provide me with a letter.'
      '#states':
        disabled:
          ':input[name="submission_editable"]':
            value: 'No'
      '#required': true
    visa_required:
      '#type': radios
      '#title': 'Do you require a visa to attend the conference?'
      '#options':
        'Yes': 'Yes'
        'No': 'No'
      '#states':
        disabled:
          ':input[name="submission_editable"]':
            value: 'No'
      '#required': true
    visa_country:
      '#type': select
      '#options': country_names
      '#title': 'Visa Country'
      '#states':
        visible:
          ':input[name="visa_required"]':
            value: 'Yes'
        disabled:
          ':input[name="submission_editable"]':
            value: 'No'
        required:
          ':input[name="visa_required"]':
            value: 'Yes'
    visa_contact_email:
      '#type': email
      '#title': 'Visa Contact Email'
      '#description': 'This may be the email address of the person coordinating your visa application. Use your own email address if no other address is available.'
      '#states':
        visible:
          ':input[name="visa_required"]':
            value: 'Yes'
        disabled:
          ':input[name="submission_editable"]':
            value: 'No'
        required:
          ':input[name="visa_required"]':
            value: 'Yes'
    captcha_for_submissions:
      '#type': captcha
      '#captcha_type': recaptcha/reCAPTCHA
